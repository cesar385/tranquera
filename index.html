<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3F5228">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tranquera">
<title>Tranquera — gestión de campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: libreta de campo práctica y clara, para cargar datos rápido desde el celular
   IDEA: la tranquera y el plano de potreros del establecimiento
   PICTURE: el asistente conversacional y el plano coloreado por pastoreo, descanso o cultivo
   COLOUR and TYPE: verde pastura dominante, trigo de acento, rojo tierra para alertas; Barlow Semi Condensed + Inter
   LAYOUT: barra superior, menú lateral, contenido en tarjetas; menú desplegable en celular */
:root{color-scheme:light dark;
--bg:light-dark(#F5E8D9,#171C10);--panel:light-dark(#FFFAF3,#212817);--panel2:light-dark(#FAF0E3,#1B2113);
--ink:light-dark(#2B2A1E,#F2E6D6);--mute:light-dark(#6E6656,#B4AA96);--line:light-dark(#E7D6C1,#36402A);
--green:light-dark(#3F5228,#A9BE84);--green2:light-dark(#E6E4CC,#2C3A1E);--head:#3F5228;
--accent:#D8492E;--accent2:light-dark(#FBE1D8,#43231A);
--wheat:light-dark(#8A5D0C,#E7B94F);--wheat2:light-dark(#F8E6C2,#3A3018);
--red:light-dark(#B5361F,#F08A6E);--red2:light-dark(#F9DCD2,#40211A);
--blue:light-dark(#2a6a95,#82bde6);--blue2:light-dark(#e0edf6,#18293a);
--violet:light-dark(#6a4a9c,#b9a0e6);--violet2:light-dark(#eee7f8,#2a2238)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
h1,h2,h3,h4{font-family:"Barlow Semi Condensed",Inter,sans-serif;font-weight:700;line-height:1.1;margin:0}
h1{font-size:clamp(28px,4vw,40px);text-wrap:balance}h2{font-size:21px}h3{font-size:18px}h4{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
.mute{color:var(--mute)}.sm{font-size:13px}
.top{height:58px;background:var(--head);color:#f2f5ee;display:flex;align-items:center;gap:10px;padding:0 14px;position:relative;z-index:30}
.brand svg{flex:none}
.brand{display:flex;align-items:center;gap:9px;font:700 23px "Barlow Semi Condensed",sans-serif;color:#fff;text-decoration:none}
.top .sp{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 13px;border-radius:9px;border:1px solid #ffffff33;background:#ffffff10;color:#fff;font-size:14px;white-space:nowrap;text-decoration:none}
.tbtn:hover{background:#ffffff22}
.tbtn svg{width:16px;height:16px}
#menuBtn{width:40px;padding:0;justify-content:center}
.wrap{display:grid;grid-template-columns:236px minmax(0,1fr);height:calc(100% - 58px)}
.side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px 24px}
.side .est{font-size:12px;font-weight:600;color:var(--mute);padding:2px 10px 8px}
.side .grp{font-size:12px;font-weight:600;color:var(--mute);padding:14px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:9px;background:none;text-align:left;font-size:14.5px;color:var(--ink);text-decoration:none}
.nav:hover{background:var(--panel2)}
.nav.on{background:var(--green2);color:var(--green);font-weight:600}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.nav .badge{margin-left:auto;background:var(--green);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:600}
.nav.ai{border:1px solid var(--line);min-height:52px;margin-bottom:6px}
.nav.ai small{display:block;font-size:12px;color:var(--mute);font-weight:400}
main{overflow-y:auto;padding:22px clamp(14px,3vw,34px) 60px}
.page{max-width:1180px;margin:0 auto}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.phead h1{font-size:30px;margin-right:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--green);border-color:var(--green);color:light-dark(#fff,#1F2914)}
.btn.warn{color:var(--red)}
.btn.s{min-height:34px;padding:0 11px;font-size:13px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.chip.g{background:var(--green2);border-color:transparent;color:var(--green)}
.chip.w{background:var(--wheat2);border-color:transparent;color:var(--wheat)}
.chip.r{background:var(--red2);border-color:transparent;color:var(--red)}
.chip.b{background:var(--blue2);border-color:transparent;color:var(--blue)}
.chip.v{background:var(--violet2);border-color:transparent;color:var(--violet)}
button.chip{min-height:34px;padding:0 12px;cursor:pointer}
button.chip.on{background:var(--green);color:light-dark(#fff,#1F2914);border-color:var(--green)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],input[type=month],select,textarea{width:100%;min-height:42px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:16px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);flex:none}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.search{position:relative;flex:1 1 220px}
.search input{padding-left:36px}
.search svg{position:absolute;left:11px;top:12px;width:18px;height:18px;opacity:.5}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-size:14.5px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;min-height:44px}
.tab.on{color:var(--green);border-color:var(--green);font-weight:600}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:12.5px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.sel td{background:var(--green2)}
.scroll{overflow-x:auto}
.fig{position:relative;height:280px}
.bar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.kpi .lbl{font-size:13px;color:var(--mute)}
.kpi .val{font:700 30px/1.1 "Barlow Semi Condensed",sans-serif;margin:4px 0;font-variant-numeric:tabular-nums}
.kpi svg{width:100%;height:36px;display:block;margin-top:6px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:92px 34px minmax(0,1fr) auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.feed li:last-child{border:0}
.feed .d{font-size:12.5px;color:var(--mute);padding-top:7px}
.ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 12px Inter;color:#fff;flex:none}
.feed .a{font-size:12.5px;color:var(--mute)}
.x{border:0;background:none;color:var(--mute);min-width:34px;min-height:34px;border-radius:8px;display:inline-grid;place-items:center}
.x svg{width:17px;height:17px}
.x:hover{background:var(--panel2);color:var(--ink)}
.x.del:hover{color:var(--red)}
.det{border-left:3px solid var(--c);background:var(--panel2);border-radius:0 10px 10px 0;padding:8px 12px;margin-top:10px;font-size:13.5px}
.det .tt{display:block;font-size:12px;font-weight:700;color:var(--c);margin-bottom:2px}
.det div b{font-weight:600}
.dcard{margin-bottom:10px}
.dcard .who{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--blue2);color:var(--blue);font:700 13px Inter;flex:none}
.aiw{max-width:820px;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
.hero{text-align:center;padding:5vh 0 22px}
.hero svg{width:96px;height:96px;margin-bottom:14px}
.hero p{color:var(--mute);margin:10px auto 0;max-width:520px}
.ask{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 12px 8px;box-shadow:0 8px 30px -18px #3F522866}
.ask textarea{border:0;min-height:56px;padding:4px 6px;background:none}
.ask textarea:focus-visible{outline:0}
.askbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.send{width:42px;height:42px;border-radius:12px;border:0;background:var(--green);color:#fff;display:grid;place-items:center}
.send svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 26px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-size:13.5px;min-height:38px}
.chips button:hover{border-color:var(--green);color:var(--green)}
.rep{cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:14px;position:relative}
.rep:hover{border-color:var(--green)}
.rep b{font:700 17px "Barlow Semi Condensed",sans-serif;padding-right:30px}
.rep .star{position:absolute;top:8px;right:8px}
.star{border:0;background:none;color:var(--mute);min-width:36px;min-height:36px;border-radius:8px;display:inline-grid;place-items:center}
.star svg{width:20px;height:20px}
.star.on{color:var(--wheat)}
.thread{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:18px}
.msg{max-width:88%;padding:11px 14px;border-radius:14px;font-size:15px}
.msg.u{align-self:flex-end;background:var(--green);color:light-dark(#fff,#1F2914);border-bottom-right-radius:4px}
.msg.b{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.b table{font-size:13.5px;margin-top:8px}
.msg.b ul{margin:6px 0;padding-left:20px}
.stick{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding-top:18px}
.hist{margin-top:14px}
.hist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 6px;min-height:44px}
.pcard .meta{font-size:12px;color:var(--mute);font-weight:600;margin:10px 0 5px}
.pcard .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.state{font-size:13px;font-weight:600}
.state.p{color:var(--red)}.state.d{color:var(--green)}
.map{width:100%;height:auto;display:block;border-radius:12px;background:light-dark(#EADCC6,#1B2113);touch-action:none}
.map text{font:600 2.3px Inter;fill:#17210f;pointer-events:none}
.map text.s{font-weight:400;font-size:1.9px}
.map .p{stroke:light-dark(#ffffff,#10150f);stroke-width:.5;cursor:pointer}
.map .p.sel{stroke:var(--ink);stroke-width:.8}
.legend .grad i{width:54px}
.map .pt{cursor:pointer}.map .pt circle{fill:#fff;stroke:#3F5228;stroke-width:.3}.map .pt text{font-size:1.9px;pointer-events:none}
.map.crosshair,.map.crosshair .p{cursor:crosshair}
.mbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:none;color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:7px 14px;cursor:pointer;min-height:36px}
.seg button.on{background:var(--green);color:light-dark(#fff,#1F2914)}
.mlay{position:relative}.mlay summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}.mlay summary::-webkit-details-marker{display:none}.mlay summary svg{width:16px;height:16px}
.mlaypop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #0003;padding:12px 14px;min-width:250px;display:grid;gap:4px}.mlaypop hr{border:0;border-top:1px solid var(--line);margin:6px 0}.mlaypop .chk2{margin:0}
.mwrap{position:relative;isolation:isolate}.mpanel[hidden]{display:none}
.mtools{position:absolute;top:10px;right:10px;z-index:1000;display:grid;gap:6px}
.mtb{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid #0002;background:#fffffff0;color:#2B2A1E;cursor:pointer;box-shadow:0 1px 4px #0003;padding:0}.mtb svg{width:20px;height:20px}.mtb:hover{background:#fff}.mtb.on{background:#D8492E;color:#fff;border-color:#D8492E}
.mpanel{position:absolute;left:10px;right:60px;bottom:10px;z-index:1000;background:#fffffff5;color:#2B2A1E;border-radius:12px;box-shadow:0 2px 12px #0004;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:14px}.mpanel .btn{min-height:34px}
.mwrap>svg.map+.mtools+.mpanel{right:60px}
.satbox.crosshair .leaflet-container,.satbox.crosshair{cursor:crosshair}
.plab div{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;font-family:Inter,system-ui,sans-serif;color:#fff;line-height:1.15;text-shadow:0 0 3px #000,0 0 6px #000c;pointer-events:none}.plab small{display:block;font-weight:500;font-size:.85em;opacity:.95}
.ppin div{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid #3F5228;display:grid;place-items:center;font-size:16px;box-shadow:0 1px 5px #0008;cursor:pointer}
.vtx{background:#fff;border:3px solid #D8492E;border-radius:50%;box-shadow:0 1px 4px #0008;cursor:move}.vtx.v0{border-width:5px}.vtx.mid{background:#D8492E;border:2px solid #fff;opacity:.85;cursor:copy}
.mcard.mfull{position:fixed;inset:0;z-index:42;border-radius:0;margin:0;overflow:auto;padding:12px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left))}
.mcard.mfull .satbox{height:calc(100dvh - 130px)}.mcard.mfull svg.map{max-height:calc(100dvh - 130px);width:auto;max-width:100%;margin:0 auto}
body.mfull-on .bnav,body.mfull-on .top{visibility:hidden}
.satmsg button{margin-left:8px;background:none;border:1px solid #fff8;color:#fff;border-radius:8px;padding:2px 8px;cursor:pointer;font:inherit}
@media(max-width:600px){.mbar .row{order:3;width:100%}.seg button{padding:7px 12px}.mpanel{right:10px;bottom:10px;left:10px}.mtools{top:8px;right:8px}}
.map rect.h{fill:var(--ink);cursor:nwse-resize}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.prog{display:flex;align-items:center;gap:12px;font-size:13px}
.prog .bar{flex:1}
.ghead{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;font-weight:600;border:0;width:100%;background:var(--wheat2);color:var(--wheat);min-height:44px}
.ghead.done{background:var(--green2);color:var(--green)}
.trow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.trow .t{font-size:14.5px;margin-top:4px}
.trow.hecha .t{color:var(--mute);text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mute);background:none;display:grid;place-items:center;padding:0;margin-top:2px}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.chk svg{width:14px;height:14px}
.late{color:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:12px;font-weight:600;color:var(--mute);text-align:center;padding:4px}
.cal .d{min-height:92px;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--panel);font-size:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.cal .d.o{opacity:.45}.cal .d.t{border-color:var(--green);border-width:2px}
.cal .ev{display:block;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--wheat2);color:var(--wheat)}
.cal .ev.ok{background:var(--green2);color:var(--green);text-decoration:line-through}
.icat{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--mute);margin:18px 0 8px}
.icard .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0}
.icard .nums small{display:block;font-size:11.5px;color:var(--mute)}
.icard .nums b{font:700 20px "Barlow Semi Condensed",sans-serif;font-variant-numeric:tabular-nums}
.icard .nums em{display:block;font-style:normal;font-size:11.5px;color:var(--green)}
.neg{color:var(--red)}
.ov{position:fixed;inset:0;background:#0b120a88;display:grid;place-items:center;z-index:50;padding:14px}
.dlg{background:var(--panel);border-radius:16px;width:min(620px,100%);max-height:calc(100vh - 28px);overflow-y:auto;padding:20px;box-shadow:0 20px 60px -20px #000}
.dlg.wide{width:min(900px,100%)}
.dlg h2{margin-bottom:14px;display:flex;align-items:center;gap:10px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:0 10px}
.chk2{display:flex;gap:10px;align-items:center;font-size:14px;min-height:42px;margin-bottom:8px}
.repbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 10px 4px;margin-bottom:12px}
.repbox>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.reprow{display:grid;gap:8px;margin-bottom:8px;align-items:end}
.reprow label{font-size:12px;color:var(--mute)}
.addrow{width:100%;border:1px dashed var(--mute);background:none;border-radius:10px;min-height:40px;margin-bottom:8px;color:var(--green);font-weight:600}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;position:sticky;bottom:-20px;background:var(--panel);padding:10px 0}
.typegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr));gap:6px 18px}
.typegrid h4{font-size:12.5px;letter-spacing:.2px;border-left:3px solid var(--c);padding-left:7px;margin:4px 0 4px;font-family:Inter;font-weight:700}
.topt{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;padding:6px;border-radius:8px;min-height:40px;text-align:left;font-size:14px}
.topt:hover{background:var(--panel2)}
.topt .ico{width:28px;height:28px;font-size:11px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--head);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px -10px #000;max-width:calc(100vw - 24px)}

 const esN=w=>{const b=base(w);return b in NUMW||b==='mil'};
 while(i<tk.length){const w=tk[i];if(!w.trim()||!esN(w)){out.push(w);i++;continue}
  let j=i,tot=0,cur=0,words=0,end=i,last=-1;
  while(j<tk.length){const b=base(tk[j]);if(!tk[j].trim()){j++;continue}
   if(b==='y'&&last>=20&&last%10===0&&last<100){let k=j+1;while(k<tk.length&&!tk[k].trim())k++;const nb=k<tk.length?base(tk[k]):'';if(nb in NUMW&&NUMW[nb]>0&&NUMW[nb]<10){j=k;continue}break}
   if(b==='mil'){cur=(cur||1)*1000;tot+=cur;cur=0;last=1000;words++;end=j;j++;if(/[.,;:!?]$/.test(tk[end]))break;continue}
   if(!(b in NUMW))break;const v=NUMW[b];
   if(last!==-1&&!(v<last||(last===1000))&&!(last===100&&v<100))break;

   out.push(String(val)+punct);i=end+1}else{out.push(w);i++}}

function validar(tipo,v){
 if(tipo==='movimiento'&&v.origen===v.destino)return'El origen y el destino tienen que ser distintos.';
 if(['venta','mortandad','consumo','movimiento'].includes(tipo)||(tipo==='traslado'&&v.sentido==='salida')||(tipo==='ajuste'&&v.signo==='-')){const p=pot(v.origen||v.pot);const hay=+(p?.animales?.[v.cat]||0);if(p&&+v.cant>hay)return`En ${p.nombre} hay ${hay} ${v.cat.toLowerCase()}. Revisá la cantidad o la categoría.`}
 if(tipo==='recategorizacion'&&v.de===v.a)return'Elegí categorías distintas.';
 if(tipo==='pulverizacion'&&!(v.trat||[]).some(t=>t.ins&&+t.dosis))return'Agregá al menos un producto con su dosis.';
 if(tipo==='uso_insumo'&&!(v.items||[]).some(t=>t.ins&&+t.cant))return'Agregá al menos un insumo con su cantidad.';
 if(AGRI.includes(tipo)&&!(v.lotes||[]).some(l=>l.pot))return'Elegí al menos un potrero.';
 if(['siembra','cosecha'].includes(tipo)&&!v.cultivo)return'Indicá el cultivo.';
 return''}

async function verificarCodigo(code){code=String(code||'').trim().replace(/\s+/g,'');const m=code.match(/^TQ1\.([\w-]+)\.([\w-]+)$/);if(!m)throw new Error('El código no tiene el formato correcto. Copialo completo, empieza con TQ1.');
 if(!crypto?.subtle)throw new Error('Este navegador no permite verificar el código. Abrí la app desde su dirección https.');
 const key=await crypto.subtle.importKey('jwk',{...LIC_PUB,ext:true},{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
 const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,b64u.dec(m[2]),new TextEncoder().encode(m[1]));if(!ok)throw new Error('El código no es válido.');
 const P=JSON.parse(new TextDecoder().decode(b64u.dec(m[1])));return P}

 <details><summary>¿Cuánto cuesta?</summary><p>Los primeros ${VENTA.prueba} días son gratis y sin tarjeta. Después elegís un plan mensual (mirá los precios más arriba) y lo pagás con débito automático de Mercado Pago. Si no seguís, tus datos quedan para ver y exportar.</p></details><details><summary>¿Funciona sin señal en el campo?</summary><p>Sí. Instalala en el celular desde el navegador («Agregar a pantalla de inicio»): se abre como una app y lo que cargues sin señal queda guardado en el teléfono.</p></details>
 <details><summary>¿Dónde se guardan mis datos?</summary><p>${NUBE_ON?'En la nube, separados por empresa: entrás desde cualquier celular o computadora y tu equipo ve lo mismo. También podés copiar una copia de seguridad completa desde Preferencias.':'En el navegador del dispositivo donde los cargás. Desde Preferencias podés copiar una copia de seguridad completa y restaurarla en otra computadora o celular.'}</p></details>
 <details><summary>¿Necesito internet?</summary><p>Para abrir la app, sí. Una vez abierta, podés seguir cargando datos aunque se corte la señal; los gráficos pueden no verse hasta que vuelva la conexión.</p></details>
 <details><summary>¿Lo puede usar mi equipo?</summary><p>${NUBE_ON?'Sí. Invitás a cada persona con su email y un rol (administrador, colaborador, solo lectura…). Todos trabajan sobre los mismos datos y lo que carga cada uno queda a su nombre, desde la app o desde Telegram.':`Podés registrar a tu equipo con sus roles y asignarles tareas. Por ahora cada dispositivo guarda sus propios datos: para que todos vean lo mismo al mismo tiempo hace falta conectar una base de datos compartida.`}</p></details>
 <details><summary>¿Puedo traer mis potreros de Google Earth?</summary><p>Sí. En «Cómo empezar» subís el archivo KMZ o KML con los polígonos y se crean los potreros con su superficie.</p></details></div></section>

async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))|0;return'x'+(h>>>0).toString(16)}}

/* ================= Nube (Supabase): cuentas reales, datos por empresa y bot único ================= */
/* Se completa con los datos del proyecto de Supabase. Si queda vacío, la app funciona como antes, en el navegador. */
const NUBE={url:'__URL__',key:'__KEY__',bot:'EraTranqueraBot'};
const NUBE_ON=!!(NUBE.url&&NUBE.key&&!NUBE.url.startsWith('__'));
let sb=null,ORG=null,ORGS=[],VER=0,canal=null,CARGANDO=false,tGuardar=null;const NE={pend:false,guardando:false};
const BASE_URL=()=>location.origin+location.pathname;
function nubeInit(){if(!NUBE_ON||!window.supabase?.createClient)return;try{sb=supabase.createClient(NUBE.url,NUBE.key,{auth:{flowType:'pkce',persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}})}catch(e){sb=null}}
function trad(m){m=String(m||'');if(/invalid login/i.test(m))return'El email o la contraseña no coinciden.';if(/not confirmed/i.test(m))return'Todavía no confirmaste tu email: buscá el correo que te mandamos y abrí el enlace.';if(/already registered|already been registered/i.test(m))return'Ya hay una cuenta con ese email. Ingresá desde «Ingresar».';if(/rate limit|too many|security purposes/i.test(m))return'Hubo demasiados intentos. Esperá unos minutos y probá de nuevo.';if(/password/i.test(m)&&/least|short|weak/i.test(m))return'La contraseña es muy corta o muy simple: usá al menos 8 caracteres.';if(/fetch|network|failed to fetch|load failed/i.test(m))return'No hay conexión con el servidor. Revisá internet y probá de nuevo.';if(/sin permiso/.test(m))return'Tu rol en la empresa no permite hacer eso.';return m}
const leerPend=()=>{try{return JSON.parse(localStorage.getItem('tranquera-pend')||'null')}catch(e){return null}};
const guardarPend=o=>{try{localStorage.setItem('tranquera-pend',JSON.stringify(o))}catch(e){}};
const borrarPend=()=>{try{localStorage.removeItem('tranquera-pend')}catch(e){}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
function cacheLocal(){if(!S||!CI.cur)return;try{localStorage.setItem('tranquera-cache-'+CI.cur,JSON.stringify({data:S,version:VER,pend:NE.pend}))}catch(e){}}
async function abrirNube(user,vuelta=0){
 const {data:c,error}=await sb.rpc('mi_cuenta');if(error)throw error;
 if(c.invitaciones?.length&&vuelta<2){for(const i of c.invitaciones){try{await sb.rpc('aceptar_invitacion',{p_org:i.org})}catch(e){}}return abrirNube(user,vuelta+1)}
 if(!c.orgs.length){
  const pend=leerPend()||{};const nombre=cap(pend.nombre||user.user_metadata?.nombre||user.email.split('@')[0]);
  const leg=pend.traer?camposLegado().map(x=>({nombre:x.nombre,data:load(x.id)})).filter(x=>x.data):[];
  const campoN=pend.campo||leg[0]?.nombre||'Mi campo';
  const base=leg[0]?.data||(()=>{const d=vacio(campoN);d.config.tipo=pend.tipo||'mixto';return d})();
  base.usuario=nombre;if(!(base.equipo||[]).some(e=>e.nombre===nombre))base.equipo=[{id:uid(),nombre,rol:'Administrador con finanzas',puesto:'Productor',alta:hoy(),contacto:user.email},...(base.equipo||[])];
  const {data:r,error:e2}=await sb.rpc('crear_org',{p_org:pend.org||campoN,p_campo:campoN,p_data:migrar(base),p_nombre:nombre});if(e2)throw e2;
  for(const x of leg.slice(1)){try{await sb.rpc('crear_campo',{p_org:r.org,p_nombre:x.nombre,p_data:migrar(x.data)})}catch(e){}}
  borrarPend();return abrirNube(user,vuelta+1)}
 ORGS=c.orgs;ORG=ORGS.find(o=>o.id===lsGet('tranquera-org'))||ORGS[0];lsSet('tranquera-org',ORG.id);
 SES={uid:user.id,nombre:ORG.nombre_miembro||user.email.split('@')[0],email:user.email,nube:true};
 await cargarCampos()}
async function cargarCampos(id){const {data:cs,error}=await sb.from('campos').select('id,nombre').eq('org_id',ORG.id).order('nombre');if(error)throw error;
 CI={cur:id||lsGet('tranquera-campo-'+ORG.id),list:cs.map(x=>({id:x.id,nombre:x.nombre}))};if(!CI.list.some(x=>x.id===CI.cur))CI.cur=CI.list[0]?.id||null;
 if(!CI.cur){const d=vacio(ORG.nombre);d.usuario=SES.nombre;const {data:nid}=await sb.rpc('crear_campo',{p_org:ORG.id,p_nombre:ORG.nombre,p_data:migrar(d)});return cargarCampos(nid)}
 await cargarCampo(CI.cur)}
async function cargarCampo(id){let row=null;
 try{const {data,error}=await sb.from('campos').select('data,version,nombre').eq('id',id).single();if(error)throw error;row=data}
 catch(e){const c=JSON.parse(lsGet('tranquera-cache-'+id)||'null');if(!c)throw e;S=migrar(c.data);VER=c.version;NE.pend=!!c.pend;S.usuario=SES.nombre;syncCats();toast('Sin conexión: mostrando la última copia guardada en este dispositivo.');return}
 const cache=JSON.parse(lsGet('tranquera-cache-'+id)||'null');
 if(cache?.pend&&cache.version===row.version){S=migrar(cache.data);VER=row.version;NE.pend=true;setTimeout(guardarNube,300)}
 else{S=migrar(row.data&&Object.keys(row.data).length?row.data:vacio(row.nombre));VER=row.version;NE.pend=false;if(cache?.pend)setTimeout(()=>conflicto(cache.data),400)}
 S.usuario=SES.nombre;if(!S.establecimiento)S.establecimiento=row.nombre;syncCats();lsSet('tranquera-campo-'+ORG.id,id);cacheLocal();suscribir(id);sincEquipo()}
function suscribir(id){try{if(canal)sb.removeChannel(canal)}catch(e){}
 canal=sb.channel('campo-'+id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'campos',filter:'id=eq.'+id},async p=>{const n=p.new||{};if(id!==CI.cur||!(n.version>VER))return;if(NE.pend||NE.guardando)return;
  let data=n.data;if(!data||!Object.keys(data).length){const r=await sb.from('campos').select('data,version').eq('id',id).single();data=r.data?.data;n.version=r.data?.version}
  if(!data)return;S=migrar(data);S.usuario=SES.nombre;syncCats();VER=n.version;cacheLocal();toast(`Datos actualizados${n.updated_by?' por '+n.updated_by:''}`);refrescar()}).subscribe()}
async function sincEquipo(){try{const {data}=await sb.from('miembros').select('nombre,email,rol').eq('org_id',ORG.id);let cambio=false;(data||[]).forEach(m=>{if(!S.equipo.some(e=>norm(e.nombre)===norm(m.nombre))){S.equipo.push({id:uid(),nombre:m.nombre,rol:m.rol,puesto:'',alta:hoy(),contacto:m.email});cambio=true}});if(cambio)save()}catch(e){}}
function guardarNubeLuego(){NE.pend=true;cacheLocal();clearTimeout(tGuardar);tGuardar=setTimeout(guardarNube,600)}
async function guardarNube(){if(!SES?.nube||!S)return;if(NE.guardando){clearTimeout(tGuardar);tGuardar=setTimeout(guardarNube,500);return}if(!NE.pend)return;if(navigator.onLine===false)return;
 NE.guardando=true;const id=CI.cur,snap=JSON.parse(JSON.stringify(S)),ver=VER;NE.pend=false;
 const {data,error}=await sb.rpc('guardar_campo',{p_id:id,p_data:snap,p_version:ver});NE.guardando=false;
 if(error){if(/conflicto/.test(error.message)){NE.pend=true;return conflicto()}NE.pend=true;cacheLocal();toast(/sin permiso/.test(error.message)?'Tu rol en la empresa no permite modificar datos.':'No se pudo guardar en la nube. Se reintenta al volver la conexión.');return}
 if(id===CI.cur){VER=data;const c=CI.list.find(x=>x.id===id);if(c&&S.establecimiento&&c.nombre!==S.establecimiento){c.nombre=S.establecimiento;side()}}cacheLocal();if(NE.pend)guardarNubeLuego()}
async function conflicto(mios){const id=CI.cur;const {data:r}=await sb.from('campos').select('data,version,updated_by').eq('id',id).single();if(!r)return;const local=mios||S;
 modal('Hubo cambios en otro dispositivo',[{html:`<p>${esc(r.updated_by||'Otra persona')} guardó cambios en <b>${esc(S?.establecimiento||'este campo')}</b> mientras vos también cargabas datos.</p><p class="mute sm">Si te quedás con los tuyos, se pisan los cambios de la otra persona. Si usás los de la nube, se pierde tu último cambio (podés volver a cargarlo).</p>`}],()=>{NE.pend=false;S=migrar(r.data);S.usuario=SES.nombre;syncCats();VER=r.version;cacheLocal();toast('Listo: estás viendo los datos de la nube');render()},'Usar los de la nube','',{});

function pasos(){const g=S.config.tipo!=='agricola';return[
 {k:'potreros',ok:S.potreros.length>0},
 ...(g?[{k:'categorias',ok:!!S.onb?.categorias}]:[]),
 {k:'cultivos',ok:!!S.onb?.cultivos},
 {k:'insumos',ok:S.insumos.length>0||!!S.onb?.insumos},
 ...(g?[{k:'animales',ok:totAnimales()>0}]:[]),
 {k:'altaCultivos',ok:S.potreros.some(p=>(p.cultivos||[]).length)}]}
function pct(){const P=pasos();return Math.round(P.filter(p=>p.ok).length/P.length*100)}
function autoPlace(p){const others=S.potreros.filter(x=>x!==p);const maxY=others.length?Math.max(...others.map(x=>(+x.y||0)+(+x.h||10))):0;const row=others.filter(x=>Math.abs(((+x.y||0)+(+x.h||10))-maxY)<.5&&!x.poly);const maxX=row.length?Math.max(...row.map(x=>(+x.x||0)+(+x.w||10))):100;
 const w=Math.max(8,Math.min(26,Math.sqrt(+p.has||50)*2.6)),h=Math.max(8,Math.min(22,w*.8));p.w=Math.round(w);p.h=Math.round(h);

let zipP=null;const needZip=()=>zipP||(zipP=new Promise((ok,ko)=>{if(window.JSZip)return ok();const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';sc.onload=ok;sc.onerror=()=>{zipP=null;ko(new Error('No se pudo cargar el lector de KMZ (sin conexión). Probá exportar como KML.'))};document.head.appendChild(sc)}));
async function leerKML(file){let txt;if(/\.kmz$/i.test(file.name)){await needZip();const z=await JSZip.loadAsync(file);const k=Object.keys(z.files).find(n=>/\.kml$/i.test(n));if(!k)throw new Error('El KMZ no tiene un archivo KML adentro.');txt=await z.files[k].async('string')}else txt=await file.text();

 const polys=[];[...doc.getElementsByTagName('Placemark')].forEach(pm=>{const nm=(pm.getElementsByTagName('name')[0]?.textContent||'').trim();for(const c of pm.getElementsByTagName('coordinates')){if(!c.closest('Polygon'))continue;const pts=c.textContent.trim().split(/\s+/).map(t=>t.split(',').map(Number)).filter(a=>a.length>=2&&!isNaN(a[0])&&!isNaN(a[1]));if(pts.length>=3){polys.push({nombre:nm||'Potrero '+(polys.length+1),pts});break}}});
 if(!polys.length)throw new Error('No encontré polígonos en el archivo. En Google Earth, dibujá cada potrero con «Agregar polígono».');
 const all=polys.flatMap(p=>p.pts);const lat0=sum(all,a=>a[1])/all.length;const kx=111320*Math.cos(lat0*Math.PI/180),ky=110574;
 const minX=Math.min(...all.map(a=>a[0])),maxX=Math.max(...all.map(a=>a[0])),minY=Math.min(...all.map(a=>a[1])),maxY=Math.max(...all.map(a=>a[1]));
 const sc=96/Math.max((maxX-minX)*kx,1);
 return polys.map(p=>{const m=p.pts.map(([lo,la])=>[(lo-minX)*kx,(maxY-la)*ky]);let A=0;for(let i=0;i<m.length;i++){const[x1,y1]=m[i],[x2,y2]=m[(i+1)%m.length];A+=x1*y2-x2*y1}const xy=m.map(([x,y])=>[+(2+x*sc).toFixed(2),+(2+y*sc).toFixed(2)]);const xs=xy.map(a=>a[0]),ys=xy.map(a=>a[1]);const x=Math.min(...xs),y=Math.min(...ys);return{geo:p.pts.map(([lo,la])=>[+la.toFixed(6),+lo.toFixed(6)]),nombre:p.nombre,has:Math.round(Math.abs(A)/2/1000)/10,poly:xy,x,y,w:+(Math.max(...xs)-x).toFixed(2),h:+(Math.max(...ys)-y).toFixed(2)}})}

let tgRun=false,tgAbort=null,tgEstado='',tgErr=0;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function tgGet(m,params={},signal){const t=tgCfg().token;const q=new URLSearchParams(Object.entries(params).map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):String(v)]));const r=await fetch(`https://api.telegram.org/bot${t}/${m}?${q}`,{signal});let j;try{j=await r.json()}catch(e){throw new Error('Respuesta inválida de Telegram')}if(!j.ok){const e=new Error(j.description||'Error de Telegram');e.code=j.error_code;throw e}return j.result}
function tgSet(t,cls=''){tgEstado=t;const el=$('#tgst');if(el)el.innerHTML=`<span class="tgdot ${cls}"></span>${esc(t)}`}

 let c=T.chats.find(x=>x.id===chat);
 if(!c){c={id:chat,nombre,usuario:m.from?.username||'',estado:'pendiente',codigo:String(1000+Math.floor(Math.random()*9000)),alta:hoy(),miembro:S.equipo.find(e=>norm(e.nombre)===norm(nombre))?.nombre||''};T.chats.push(c);toast(`${nombre} quiere usar a Era por Telegram: habilitalo en Preferencias → Era en Telegram.`)}

 log(r);save();await tgSend(chat,r);refrescar()}

async function tgLoop(){if(tgRun)return;tgRun=true;tgErr=0;tgSet('Escuchando mensajes de Telegram…','on');

 <form class="row" id="tgf" style="align-items:flex-end"><label class="fld" style="flex:1 1 280px;margin:0"><span>Token del bot</span><input type="text" id="tgtok" placeholder="123456789:AAH…" autocomplete="off" spellcheck="false"></label><button class="btn pri">Conectar</button><button type="button" class="btn" id="tgcmd">${ic('copy')}Copiar comandos</button></form><p class="sm" id="tgmsg" style="margin:8px 0 0"></p></div>`}
 ${T.token?`<div class="card" style="margin-bottom:14px"><h3>Personas habilitadas</h3><p class="mute sm">Cada persona tiene que abrir ${T.bot?.username?`<a href="https://t.me/${esc(T.bot.username)}">t.me/${esc(T.bot.username)}</a>`:'tu bot'} y mandarle <code class="k">/start</code>. Aparece acá con un código para que confirmes que es quien decís, y elegís a qué integrante del equipo corresponde: los datos que cargue quedan a su nombre.</p>
 ${T.chats.length?`<div class="scroll"><table class="stack"><thead><tr><th>En Telegram</th><th>Código</th><th>Integrante del equipo</th><th>Estado</th><th></th></tr></thead><tbody>${T.chats.map(c=>`<tr><td><b>${esc(c.nombre)}</b>${c.usuario?`<div class="sm mute">@${esc(c.usuario)}</div>`:''}</td><td>${esc(c.codigo)}</td><td><select data-tgm="${c.id}" style="min-width:170px"><option value="">— Elegir —</option>${S.equipo.map(e=>`<option ${e.nombre===c.miembro?'selected':''}>${esc(e.nombre)}</option>`).join('')}</select></td><td>${c.estado==='ok'?'<span class="chip g">Habilitado</span>':c.estado==='bloqueado'?'<span class="chip r">Bloqueado</span>':'<span class="chip w">Pendiente</span>'}</td><td class="n" style="white-space:nowrap">${c.estado!=='ok'?`<button class="btn s pri" data-tgok="${c.id}">Habilitar</button>`:''}${c.estado!=='bloqueado'?`<button class="btn s" data-tgbl="${c.id}">Bloquear</button>`:''}<button class="x del" data-tgdel="${c.id}" aria-label="Quitar">${ic('trash')}</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Todavía nadie le escribió al bot.</p>'}${pend.length?`<p class="sm" style="margin:8px 0 0"><b>${pend.length} pendiente${pend.length>1?'s':''}</b>: pedile el código que le mostró Era y habilitalo.</p>`:''}</div>
 <div class="card"><div class="row"><h3 style="flex:1">Últimos mensajes</h3>${T.log.length?'<button class="btn s" id="tglc">Borrar historial</button>':''}</div>${T.log.length?tbl(['Cuándo','Quién','Mensaje','Respuesta de Era'],T.log.slice(0,25).map(l=>[new Date(l.fecha).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),esc(l.quien),esc(l.texto),`<span class="sm">${esc(l.resp).replace(/\n/g,'<br>')}</span>`])):'<p class="mute">Sin mensajes todavía.</p>'}</div>`:''}`}
function tgBind(){if(SES?.nube){tgNube();return}const T=tgCfg();
 $('#tgcmd')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText('ayuda - Qué puedo registrar y preguntar\nresumen - Resumen del campo\ndeshacer - Deshacer tu último registro');toast('Comandos copiados')}catch(e){copyBox('Comandos para BotFather','ayuda - Qué puedo registrar y preguntar\nresumen - Resumen del campo\ndeshacer - Deshacer tu último registro','Copiá este texto y pegalo en BotFather después de /setcommands.')}});
 $('#tgf')?.addEventListener('submit',async e=>{e.preventDefault();if(bloq('telegram'))return;const tok=$('#tgtok').value.trim();const msg=$('#tgmsg');if(!/^\d{5,}:[\w-]{30,}$/.test(tok)){msg.innerHTML='<span class="neg">Ese token no tiene el formato correcto. Copialo completo desde BotFather.</span>';return}msg.textContent='Probando el token…';const viejo=T.token;T.token=tok;
  try{const me=await tgGet('getMe');T.bot={id:me.id,username:me.username,first_name:me.first_name};T.offset=0;T.activo=true;save();toast(`Conectado con @${me.username}`);render();tgAuto()}
  catch(err){T.token=viejo;msg.innerHTML=`<span class="neg">${err.code===401||err.code===404?'Telegram rechazó el token: revisá que esté completo.':'No se pudo conectar con Telegram. Si estás en la vista previa de Claude, es normal: las conexiones externas están bloqueadas. Probalo con la app publicada en GitHub Pages.'}</span>`}});
 $('#tgon')?.addEventListener('change',e=>{T.activo=e.target.checked;save();if(T.activo)tgAuto();else{tgStop();tgSet('Era no está escuchando Telegram.')}side()});
 $('#tgoff')?.addEventListener('click',e=>{e.preventDefault();confirmar('Se va a desconectar el bot de Telegram de este campo. Las personas habilitadas y el historial se borran.',()=>{tgStop();S.telegram={token:'',bot:null,offset:0,activo:false,chats:[],log:[]};save();render()},'Desconectar')});
 $$('[data-tgm]').forEach(sel=>sel.onchange=()=>{const c=T.chats.find(x=>String(x.id)===sel.dataset.tgm);c.miembro=sel.value;save()});
 $$('[data-tgok]').forEach(b=>b.onclick=async()=>{const c=T.chats.find(x=>String(x.id)===b.dataset.tgok);if(!c.miembro){toast('Elegí primero a qué integrante del equipo corresponde.');return}c.estado='ok';save();render();await tgSend(c.id,`¡Listo, ${c.nombre}! Ya podés cargar datos de ${S.establecimiento} hablándome por acá.\n\n`+TG_AYUDA())});
 $$('[data-tgbl]').forEach(b=>b.onclick=()=>{const c=T.chats.find(x=>String(x.id)===b.dataset.tgbl);c.estado='bloqueado';save();render()});
 $$('[data-tgdel]').forEach(b=>b.onclick=()=>{T.chats=T.chats.filter(x=>String(x.id)!==b.dataset.tgdel);save();render()});
 $('#tglc')?.addEventListener('click',()=>{T.log=[];save();render()})}
/* ---- Ayuda ---- */
const FRASES=[['Hacienda',['Nacieron 6 terneros en Lote 1','Moví 20 vacas de Lote 1 a Lote 3','Vendimos 30 terneros a $650.000 c/u','Se murió una vaca en Lote 1 por empaste','Pasaron 20 terneras a vaquillonas en Lote 1','Destetamos 40 terneros y 35 terneras de Lote 1 a Corral 3','Pesamos 30 terneros en Lote 1, promedio 180 kg','Tacto en Lote 1: 95 preñadas y 12 vacías','Vacunamos 50 terneros con aftosa en Lote 1','Ajuste +1 toro en Corral 2','Salieron 10 novillos hacia el campo La Loma']],['Agricultura',['Sembramos 30 ha de soja en Lote 4','Pulverizamos Lote 4 con glifosato 2 l/ha y 2,4 D 0,8 l/ha','Cosechamos 40 ha de soja en Lote 4 a 32 qq/ha','Monitoreo Lote 3: pulgón en brotes, nivel medio','Regamos 20 mm en Lote 2']],['Insumos y finanzas',['Usé 20 litros de glifosato en Lote 2','Llegaron 200 litros de glifosato a $1.200.000','Gasté $85.000 en gasoil','Pagamos 2.500 dólares de arrendamiento','Cobramos $3.000.000 por venta de soja']],['Clima, tareas y notas',['Llovieron 25 mm ayer','Helada de -3 grados','Tarea: vacunar terneros el viernes','Nota: se rompió el molino del Lote 5']],['Preguntas',['¿Qué insumos se usaron más en los últimos 3 meses?','¿Cuánta lluvia cayó este año?','¿Qué potreros están en descanso?','¿Cuántos animales hay?','¿Cuál es la carga del campo?','¿Cómo dio el tacto?','¿Qué rinde tuvimos en la cosecha?','¿Cuánto glifosato queda?','¿Qué insumos están bajo mínimo?','¿Cómo vamos con los gastos?','¿Qué tareas hay pendientes?']]];
V.ayuda=()=>{main.innerHTML=`<div class="page" style="max-width:960px">${head('Ayuda')}<div class="card" style="margin-bottom:14px"><h2>Cómo hablarle a Era</h2><p>Escribile a Era como le contarías al encargado lo que pasó: cantidad, categoría o insumo y potrero. Si no decís la fecha, se toma la de hoy; también entiende «ayer», «anteayer» y fechas como 12/11. Después de cada registro tenés un botón para deshacerlo. Tocá cualquier frase para probarla.</p></div>
 <div class="grid g2">${FRASES.map(([g,L])=>`<div class="card"><h3 style="margin-bottom:8px">${g}</h3><div class="row" style="gap:6px">${L.map(p=>`<button class="chip" data-try="${esc(p)}" style="white-space:normal;text-align:left;min-height:34px">${esc(p)}</button>`).join('')}</div></div>`).join('')}</div>
 <div class="card" style="margin-top:14px"><h2>Atajos y datos útiles</h2><ul><li><b>Nuevo dato</b> (barra superior) abre los 27 tipos de registro con su formulario completo, incluyendo pulverizaciones con varios productos y potreros.</li><li>Las pulverizaciones, refertilizaciones, siembras con semilla y tratamientos con dosis <b>descuentan el stock</b> de insumos automáticamente.</li><li>Las ventas, compras, labores con costo e ingresos de insumos con monto <b>generan el movimiento en Finanzas</b>.</li><li><b>Era en Telegram</b>: en Preferencias creás tu bot con @BotFather, habilitás a tu equipo y cargan datos desde el chat. Comandos: /resumen, /deshacer y /ayuda.</li><li>En <b>Preferencias → Copia de seguridad</b> copiás todos tus datos para guardarlos o pasarlos a otra computadora.</li><li>Los datos se guardan en este navegador. Si borrás los datos de navegación se pierden: hacé copias seguido.</li></ul></div></div>`;
 $$('[data-try]').forEach(b=>b.onclick=()=>{pending=b.dataset.try;location.hash='asistente'})};
/* ---- Preferencias ---- */
let pSec='campo';
function listEd(key,title,desc,canDel=()=>true){const L=S[key];return`<div class="card" style="margin-bottom:14px"><h3>${title}</h3>${desc?`<p class="mute sm">${desc}</p>`:''}<div class="cl">${L.map((x,i)=>`<span class="chip">${esc(x)}<button data-ldel="${key}|${i}" aria-label="Quitar ${esc(x)}" ${canDel(x)?'':'disabled title="En uso"'}>×</button></span>`).join('')}</div><form class="row" data-ladd="${key}"><input type="text" placeholder="Agregar…" style="flex:1 1 200px"><button class="btn">Agregar</button></form></div>`}
V.preferencias=()=>{const SEC=[['Cuenta'],['plan','Plan y suscripción'],['campo','Campo'],['usuario','Usuario'],['Hacienda'],['categorias','Categorías'],['caravanas','Caravanas'],['Otros'],['cultivos','Cultivos'],['insumos','Insumos'],['finanzas','Finanzas'],['pluviometros','Pluviómetros'],['telegram','Era en Telegram'],['datos','Copia de seguridad']];
 const enUso={categorias:c=>!S.potreros.some(p=>p.animales?.[c])&&!S.caravanas.some(a=>a.categoria===c),insCats:c=>!S.insumos.some(i=>i.categoria===c),gcats:c=>!S.finanzas.some(x=>x.categoria===c),icats:c=>!S.finanzas.some(x=>x.categoria===c),pluviometros:()=>S.pluviometros.length>1};
 let body='';
 if(pSec==='plan')body=planPrefs();
 if(pSec==='campo')body=`<form class="card" id="pf"><h2 style="margin-bottom:12px">Configuración del campo</h2><div class="f2"><label class="fld"><span>Nombre del campo</span><input type="text" id="pe" value="${esc(S.establecimiento)}"></label><label class="fld"><span>Ubicación</span><input type="text" id="pubic" value="${esc(S.config.ubicacion)}"></label></div><p class="sm" style="font-weight:600;margin:6px 0">Tipo de campo</p><div class="row" style="margin-bottom:12px">${[['mixto','Ganadero o mixto'],['agricola','Agrícola']].map(([k,l])=>`<label class="chk2 card" style="flex:1 1 200px;margin:0;cursor:pointer;${S.config.tipo===k?'border-color:var(--green)':''}"><input type="radio" name="tc" value="${k}" ${S.config.tipo===k?'checked':''}> ${l}</label>`).join('')}</div><label class="chk2"><input type="checkbox" id="pon" ${S.config.ocultarNombres?'checked':''}> No mostrar los nombres ni los animales sobre el mapa</label><button class="btn pri">Guardar</button></form>
 <div class="card" style="margin-top:14px"><h3>Empezar de nuevo</h3><p class="mute sm">Los datos de ejemplo sirven para probar. Cuando quieras cargar los tuyos, empezá con el campo vacío (conviene hacer antes una copia de seguridad).</p><div class="row"><button class="btn warn" id="r0">Vaciar este campo</button><button class="btn" id="r1">Cargar datos de ejemplo</button>${CI.list.length>1?'<button class="btn warn" id="r2">Borrar este campo</button>':''}</div></div>`;
 if(pSec==='usuario')body=`<form class="card" id="pu"><h2 style="margin-bottom:12px">Usuario</h2><label class="fld"><span>Estás usando la app como</span><select id="puu">${S.equipo.map(e=>`<option ${e.nombre===S.usuario?'selected':''}>${esc(e.nombre)}</option>`).join('')}</select></label><p class="note" style="margin-top:-4px">Los datos que cargues quedan a nombre de esta persona. Para agregar personas andá a Equipo.</p><button class="btn pri">Guardar</button></form>`;
 if(pSec==='categorias')body=listEd('categorias','Categorías de hacienda','Las categorías en uso no se pueden quitar.',enUso.categorias)+`<form class="card" id="pev"><h3>Equivalente vaca por categoría</h3><p class="mute sm">Se usa para calcular la carga animal (EV/ha).</p><div class="grid g4">${CATS.map(c=>`<label class="fld"><span>${esc(c)}</span><input type="text" inputmode="decimal" data-ev="${esc(c)}" value="${nf(S.ev[c]??.8,2)}"></label>`).join('')}</div><button class="btn pri">Guardar</button></form>`;
 if(pSec==='caravanas')body=`<form class="card" id="pcv"><h2 style="margin-bottom:12px">Caravanas</h2><label class="fld"><span>Prefijo de caravana electrónica</span><input type="text" id="ppr" value="${esc(S.config.prefijo)}"></label><p class="note" style="margin-top:-4px">Se completa al agregar una caravana nueva.</p><button class="btn pri">Guardar</button></form>`;
 if(pSec==='cultivos')body=listEd('cultivos','Cultivos','Aparecen como sugerencia al sembrar, cosechar o pulverizar.')+listEd('contratistas','Contratistas','Se agregan solos cuando los escribís en una labor.');
 if(pSec==='insumos')body=listEd('insCats','Categorías de insumos','Las categorías en uso no se pueden quitar.',enUso.insCats);
 if(pSec==='finanzas')body=`<form class="card" id="pfi" style="margin-bottom:14px"><h3>Moneda e impuestos</h3><div class="grid g3"><label class="fld"><span>Tipo de cambio (pesos por dólar)</span><input type="text" inputmode="decimal" id="ptc" value="${S.config.tc}"></label><label class="fld"><span>IVA por defecto en gastos</span><select id="piv">${[0,10.5,21,27].map(v=>`<option value="${v}" ${+S.config.iva===v?'selected':''}>${v?nf(v,1)+'%':'Sin IVA'}</option>`).join('')}</select></label></div><button class="btn pri">Guardar</button></form>`+listEd('gcats','Categorías de gastos','',enUso.gcats)+listEd('icats','Categorías de ingresos','',enUso.icats);
 if(pSec==='pluviometros')body=listEd('pluviometros','Pluviómetros','Tiene que quedar al menos uno.',enUso.pluviometros);
 if(pSec==='telegram')body=tgPrefs();
 if(pSec==='datos')body=`<div class="card"><h2>Copia de seguridad</h2><p class="mute sm">Copiá este texto y guardalo (en un mail, un documento o un archivo) para respaldar todos tus datos, o pegá una copia anterior para restaurarla.</p><textarea id="bk" rows="8" spellcheck="false" style="font-size:12px"></textarea><div class="row" style="margin-top:10px"><button class="btn" id="bc">${ic('copy')}Copiar datos</button><button class="btn" id="bi">Restaurar desde el texto pegado</button></div><p class="sm" id="bmsg"></p><p class="note">Tamaño actual: ${nf(JSON.stringify(S).length/1024)} KB.</p></div>`;
 main.innerHTML=`<div class="page">${head('Preferencias')}<div class="prefs"><nav class="card subnav" style="padding:8px">${SEC.map(s=>s.length===1?`<div class="grp">${s[0].toUpperCase()}</div>`:`<button class="nav ${pSec===s[0]?'on':''}" data-ps="${s[0]}">${s[1]}</button>`).join('')}</nav><div>${body}</div></div></div>`;
 $$('[data-ps]').forEach(b=>b.onclick=()=>{pSec=b.dataset.ps;render()});if(pSec==='telegram')tgBind();if(pSec==='plan')planBind();
 $$('[data-ldel]').forEach(b=>b.onclick=()=>{const[k,i]=b.dataset.ldel.split('|');S[k].splice(+i,1);if(k==='categorias')syncCats();save();render()});
 $$('[data-ladd]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const k=f.dataset.ladd,v=cap(f.querySelector('input').value);if(!v)return;if(S[k].some(x=>norm(x)===norm(v))){toast('Ya está en la lista.');return}S[k].push(v);if(k==='categorias'){syncCats();S.ev[v]=S.ev[v]??.8}save();render()});
 $('#pf')?.addEventListener('submit',e=>{e.preventDefault();S.establecimiento=$('#pe').value.trim()||S.establecimiento;S.config.ubicacion=$('#pubic').value.trim();S.config.tipo=document.querySelector('[name=tc]:checked')?.value||'mixto';S.config.ocultarNombres=$('#pon').checked;save();toast('Guardado');render()});
 $('#pu')?.addEventListener('submit',e=>{e.preventDefault();S.usuario=$('#puu').value;save();toast('Guardado');render()});
 $('#pev')?.addEventListener('submit',e=>{e.preventDefault();$$('[data-ev]').forEach(i=>{const v=num(i.value);if(!isNaN(v))S.ev[i.dataset.ev]=v});save();toast('Guardado')});
 $('#pcv')?.addEventListener('submit',e=>{e.preventDefault();S.config.prefijo=$('#ppr').value.trim();save();toast('Guardado')});
 $('#pfi')?.addEventListener('submit',e=>{e.preventDefault();const tc=num($('#ptc').value);if(tc>0)S.config.tc=tc;S.config.iva=+$('#piv').value;save();toast('Guardado');render()});
 $('#r0')?.addEventListener('click',()=>confirmar('Se van a borrar todos los datos de este navegador y vas a empezar con el campo vacío.',()=>{S=migrar(vacio(S.establecimiento));syncCats();save();location.hash='empezar';render()},'Vaciar'));
 $('#r2')?.addEventListener('click',()=>confirmar(`Se va a borrar el campo ${S.establecimiento} con todos sus datos. No se puede deshacer.`,()=>{if(SES?.nube){borrarCampoNube();return}const id=CI.cur;CI.list=CI.list.filter(c=>c.id!==id);sdel(dKey(id));CI.cur=CI.list[0].id;sset(IDX,JSON.stringify(CI));cambiarCampo(CI.cur,true)},'Borrar campo'));
 $('#r1')?.addEventListener('click',()=>confirmar('Se van a reemplazar tus datos por los de ejemplo.',()=>{S=migrar(demo());syncCats();save();render()},'Reemplazar'));
 if($('#bk')){$('#bk').value=JSON.stringify(S);
  $('#bc').onclick=async()=>{const t=$('#bk');t.select();try{await navigator.clipboard.writeText(t.value);$('#bmsg').textContent='Copiado.'}catch(e){$('#bmsg').textContent='Texto seleccionado: copialo con Ctrl+C o manteniendo presionado.'}};
  $('#bi').onclick=()=>{try{const d=JSON.parse($('#bk').value);if(!Array.isArray(d.potreros)||!Array.isArray(d.registros))throw 0;S=migrar(d);syncCats();save();toast('Datos restaurados');render()}catch(e){$('#bmsg').textContent='El texto pegado no es una copia válida.'}}}
};
swInit();
nubeInit();
route();
nubeBoot();
tgAuto();
window.addEventListener('hashchange',()=>{if(SES&&S?.telegram?.activo&&!tgRun)tgAuto()});
new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent.trim()||''}}).observe(document.body,{childList:true,subtree:true});
}
</script>
